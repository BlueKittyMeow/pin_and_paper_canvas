name: pin_and_paper_canvas
description: Spatial canvas positioning for Pin & Paper
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Dachshund figurine sprite bundle (marble longhaired dachshund,
    # dachshund-v1-approved): 7 rotation stops x {color 768px, cast/contact
    # shadow 256px}. Rendered neutral-lit per the desk style bible; shadow
    # layers composite at ~40% opacity in DachshundFigurine.
    - assets/desk_objects/dachshund/
    # Gem habit bundle (habit_v1, owner-approved 2026-08-05): five minerals,
    # each modeled in its real growth habit. Same layout as the dachshund:
    # 960px neutral-lit color + 320px shadow layers x 7 stops.
    - assets/desk_objects/gems/amethyst/
    - assets/desk_objects/gems/citrine/
    - assets/desk_objects/gems/rose_quartz/
    - assets/desk_objects/gems/fluorite/
    - assets/desk_objects/gems/snowflake_obsidian/